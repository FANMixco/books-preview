<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Federico – Timeless Stories Link Dashboard</title>
    <link rel="stylesheet" href="index.css">
    <!-- Meta Description -->
    <meta name="description"
        content="A series of books written by Federico Navarrete. They represent the largest collection of Salvadoran oral stories in English.">

    <!-- Favicon-->
    <meta name="keywords"
        content="timeless stories, el salvador, folklore, legends, fairytales, ciptio, black night, siguanaba, francis drake, children, lodz, poland, madrid, spain, españa, cadejo,Federico Navarrete,audible,kdp,amazon,audiobook,book,cuyancua,fiction,guirola,angel,family,history">

    <link rel="apple-touch-icon" sizes="180x180" href="img/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicons/favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">
</head>

<body>
    <div class="app">
        <h1 id="title"></h1>
        <p id="subtitle"></p>

        <label for="volumeSelect" id="selectLabel"></label>
        <select id="volumeSelect"></select>

        <div class="links" id="linksContainer"></div>

        <div class="preview">
            <img id="previewImage" src="" alt="Book preview" />
        </div>

        <a href="#" class="link-btn link-qr" id="qrButton"></a>

        <a href="https://amzn.to/3YXGR5W" target="_blank" class="link-btn link-qr" id="followMe"></a>

        <div class="footer"><a href="https://www.cognitoforms.com/FedericoNavarrete1/LetsGetInTouchTimelessStories"
                target="_blank">Federico</a> · Mobile Dashboard</div>
    </div>

    <!-- QR Modal -->
    <div class="modal" id="qrModal">
        <div class="modal-content">
            <h2 id="qrTitle"></h2>
            <img id="qrImage" src="" alt="QR Code" />
            <a href="#" class="link-btn" id="closeModal"></a>
        </div>
    </div>

    <script src="index.js"></script>

    <script type="application/ld+json">
			{
			  "@context": "https://schema.org/",
			  "@type": "WebSite",
			  "name": "Timeless Stories of El Salvador",
			  "url": "https://books.federiconavarrete.com",
			  "potentialAction": {
				"@type": "SearchAction",
				"target": "{search_term_string}",
				"query-input": "required name=search_term_string"
			  }
			}
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y6F0CLJDS8"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-Y6F0CLJDS8');
    </script>
</body>

</html>
